---
name: Feature
description: New capability or milestone-sized change
title: "[area] "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        For large features, agents add `docs/project/issues/<n>/spec.md` after triage.
        See [github-workflow.md](https://github.com/Joeydekruis/dockyrd/blob/development/docs/project/github-workflow.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist a reviewer can verify
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - go / api
        - web / dashboard
        - install / packaging
        - docs
        - ci
    validations:
      required: true
