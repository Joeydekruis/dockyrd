version: 2

project_name: dockyrd

before:
  hooks:
    - go mod tidy
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  - id: dockyrd
    main: ./cmd/dockyrd
    binary: dockyrd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  - id: dy
    main: ./cmd/dy
    binary: dy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    format: tar.gz
    builds:
      - dockyrd
      - dy
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  name_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: Joeydekruis
    name: dockyrd
  name_template: "dockyrd {{.Version}}"

changelog:
  disable: true

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "${artifact}"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
    artifacts: checksum
